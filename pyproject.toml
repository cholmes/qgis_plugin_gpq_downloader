[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpq_downloader"
version = "0.9.3"
description = "QGIS plugin for downloading and processing GeoParquet files"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "GPL-2.0-or-later"}
authors = [
    {name = "Chris Holmes", email = "cholmes@9eo.org"}
]
dependencies = [
    # Capped below 2.0 while #203 is open; see duckdb_setup.BELOW_VERSION
    "duckdb>=1.1.0,<2.0",
]

[project.urls]
"Homepage" = "https://github.com/cholmes/qgis_plugin_gpq_downloader"
"Bug Tracker" = "https://github.com/yourusername/qgis_plugin_gpq_downloader/issues"

[tool.setuptools]
packages = ["gpq_downloader", "gpq_downloader.core", "gpq_downloader.gui", "gpq_downloader.qgis_io"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/tests"]
python_files = "test_*.py"
# The coverage floor is the ratchet from #194: CI measured 70% with the
# characterization suite, and the gate sits one point under so a rounding
# wobble never fails a run. It only moves up (#198 raises it 15 points by 1.0).
addopts = "--cov=gpq_downloader --cov-fail-under=69"
markers = [
    "integration: needs network access or real remote data",
]

[tool.coverage.run]
source = ["gpq_downloader"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[tool.importlinter]
root_package = "gpq_downloader"
# The forbidden modules are external, so they have to be in the import graph.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core stays QGIS-free"
type = "forbidden"
source_modules = ["gpq_downloader.core"]
forbidden_modules = ["qgis", "PyQt5", "PyQt6", "osgeo"]

[tool.black]
line-length = 88
target-version = ['py37', 'py38', 'py39', 'py310']
include = '\.pyi?$'

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-mock>=3.11.1",
    "pytest-cov>=4.1.0",
    "pyarrow>=10.0.0",
    "black>=23.3.0",
    "import-linter>=2.0",
]

[tool.setuptools.package-data]
gpq_downloader = ["data/*.json"]