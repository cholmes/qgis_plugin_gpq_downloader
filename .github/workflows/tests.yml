name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:  # release.yml runs the suite before it publishes

permissions:
  contents: read

jobs:
  test:
    # Both Qt generations: the plugin supports QGIS 3 and 4, and a Qt6-only
    # break passes a Qt5-only suite and ships (#185).
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: qgis/qgis:release-3_34
            name: QGIS 3.34 (Qt5)
          - image: qgis/qgis:4.2
            name: QGIS 4.2 (Qt6)
    container:
      image: ${{ matrix.image }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Python dependencies
      run: |
        # The QGIS 4 images are Debian trixie / Ubuntu questing, which enforce
        # PEP 668. Installing into the system interpreter is what we want here:
        # the tests need the qgis module, which only it has.
        PIP_FLAGS=""
        if pip3 install --help | grep -q break-system-packages; then
          PIP_FLAGS="--break-system-packages"
        fi
        python3 -m pip install $PIP_FLAGS --upgrade pip
        pip3 install $PIP_FLAGS pytest pytest-qt
        # Install in development mode to ensure data files are available
        pip3 install $PIP_FLAGS -e .[dev]

    - name: Debug package installation
      run: |
        python3 -c "import qgis.core; from qgis.PyQt.QtCore import QT_VERSION_STR; print('QGIS', qgis.core.Qgis.QGIS_VERSION, 'Qt', QT_VERSION_STR)"
        # Print out installed package location
        python3 -c "import gpq_downloader; print(gpq_downloader.__file__)"
        # Check if data directory exists
        ls -la $(python3 -c "import gpq_downloader; import os; print(os.path.dirname(gpq_downloader.__file__))")/data || echo "Data directory not found"

    - name: Create data directory if missing
      run: |
        # Create data directory if it doesn't exist
        PACKAGE_DIR=$(python3 -c "import gpq_downloader; import os; print(os.path.dirname(gpq_downloader.__file__))")
        mkdir -p $PACKAGE_DIR/data
        # If presets.json doesn't exist, create a minimal version
        if [ ! -f "$PACKAGE_DIR/data/presets.json" ]; then
          echo '{"datasets": {}}' > $PACKAGE_DIR/data/presets.json
          echo "Created minimal presets.json file at $PACKAGE_DIR/data/presets.json"
        fi

    - name: Run tests with xvfb
      run: |
        # Make sure xvfb is installed in container
        apt-get update && apt-get install -y xvfb

        # Run tests with virtual display
        xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" pytest
